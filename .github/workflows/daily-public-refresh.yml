name: Daily Public Prediction Refresh

on:
  schedule:
    - cron: "0 21 * * *" # 04:00 Asia/Jakarta (UTC+7)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-public-prediction-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install certifi

      - name: Refresh public dataset and prediction payload
        env:
          APP_ENV: production
          APP_ENV_LABEL: PRODUCTION
          APP_NAME: FloodGIS Jakarta Timur
        run: |
          python refresh_public_predictions.py \
            --app-environment production \
            --app-environment-label PRODUCTION \
            --timezone Asia/Jakarta

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Master_Data_Spasial_Jaktim_1990_sekarang.csv data/east-jakarta-predictions.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan dataset/prediksi."
            exit 0
          fi
          git commit -m "chore: refresh public predictions"
          git push
